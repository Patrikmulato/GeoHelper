packages:
  - .
  - backend
publicHoistPattern:
  - '@prisma/*'
  - 'prisma'
  - 'jsonwebtoken'
  - '@types/jsonwebtoken'
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
overrides:
  js-yaml: 5.1.0
