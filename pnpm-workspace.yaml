packages:
  - .
  - backend
publicHoistPattern:
  - '@prisma/*'
  - 'prisma'
  - 'jsonwebtoken'
  - '@types/jsonwebtoken'
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
overrides:
  js-yaml: 4.3.0
  '@hono/node-server': 2.0.12
